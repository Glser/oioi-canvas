server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /assets 是前端路由，且与构建产物目录同名；刷新时直接回退 SPA，避免目录 301/403。
    location ~ ^/assets/?$ {
        try_files /index.html =404;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
