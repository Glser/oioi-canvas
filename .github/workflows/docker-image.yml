name: Docker image

on:
  push:
    branches: ["feat/local-agent-mcp-bridge"]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "要打包的分支、标签或提交（留空则构建所选分支）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-flow-acr
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-pd9pvjyewqjvbrn0.cn-beijing.personal.cr.aliyuncs.com
  ACR_REPOSITORY: glser/oioi-canvas

jobs:
  build_and_push:
    name: Build Flow and push to Aliyun ACR (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check ACR secrets
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::请在当前仓库 Settings → Secrets and variables → Actions 中配置 ACR_USERNAME 和 ACR_PASSWORD。"
            exit 1
          fi

      - name: Check out selected code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Resolve source commit
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION 必须为 vX.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Aliyun ACR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=flow-amd64
          cache-to: type=gha,mode=max,scope=flow-amd64

      - name: Summary
        env:
          IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}
          SHA: ${{ steps.meta.outputs.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Flow 镜像已推送至阿里云 ACR"
            echo "- 最新镜像：\`$IMAGE:latest\`"
            echo "- 提交镜像：\`$IMAGE:$SHORT_SHA\`"
            echo "- 版本镜像：\`$IMAGE:$VERSION\`"
            echo "- 源码提交：\`$SHA\`"
            echo "- 镜像摘要：\`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
